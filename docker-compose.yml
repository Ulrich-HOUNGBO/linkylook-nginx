  server {
    listen 80;
    server_name linkylook.com www.linkylook.com;

    # 1️⃣ STATIC FILES FIRST (VERY IMPORTANT)
    location ^~ /_next/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://linkylook-web:3004;
    }

    # 2️⃣ SLUG REWRITE
    location ~ ^/([^/]+)$ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://linkylook-web:3004/links/$1;
    proxy_redirect off;
    }

    # 3️⃣ EVERYTHING ELSE
    location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://linkylook-web:3004;
    proxy_redirect off;
    }
  }