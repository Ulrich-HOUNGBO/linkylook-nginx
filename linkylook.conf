server {
    listen 80;
    server_name linkylook.com www.linkylook.com;

    # 1) Next.js static chunks
    location ^~ /_next/static/ {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://linkylook-web:3000;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # 2) Next.js image optimizer
    location ^~ /_next/image/ {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://linkylook-web:3000;
    }

    # 3) Home → app root
    location = / {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://linkylook-web:3000/;
    }

    # 4) Only single-segment slugs → /links/<slug>
    location ~ ^/([^/]+)$ {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://linkylook-web:3000/links/$1;
        proxy_redirect off;
    }

    # 5) Fallback: forward as-is
    location / {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://linkylook-web:3000;
        proxy_redirect off;
    }
}