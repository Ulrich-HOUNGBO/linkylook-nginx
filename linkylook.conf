server {
    listen 80;
    server_name linkylook.com www.linkylook.com;

    # Next.js static files
    location ^~ /_next/static/ {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://linkylook-web:3004;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Next.js images
    location ^~ /_next/image/ {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://linkylook-web:3004;
    }

    # Home
    location = / {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://linkylook-web:3004/;
    }

    # Single segment slug → /links/slug (internal rewrite)
    location ~ ^/([^/]+)$ {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://linkylook-web:3004/links/$1;
        proxy_redirect off;
    }

    # Fallback
    location / {
        proxy_set_header Host app.linkylook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://linkylook-web:3004;
        proxy_redirect off;
    }
}